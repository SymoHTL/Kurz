name: review

# The job runs for a pull request into the default branch, or for a dispatch on the default branch,
# and its checkout names the default branch: the reviewer and its rules are the merged ones, and
# the pull request is data that is never checked out or run. Facts of this file are pinned by
# tools/lint_ci.py. A copy of this file on another branch can drop them, and a dispatch on that
# branch runs the copy (HAZARD #11).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (a Draft, or a pull request from outside, is reviewed this way)
        required: true

permissions:
  contents: read
  issues: write  # low findings are collected on an issue
  pull-requests: write
  statuses: write

jobs:
  # The required check is the commit status `review`, which this job posts when a review completed.
  # The job may be skipped: a Draft, a pull request from outside, and the Ready event of a pull
  # request whose head carries the label `reviewed-<that head's sha>` (its review ran off the
  # pipeline, which posts no status) get no status and stay pending. A label names one head: any
  # other head, pushed before or after Ready, is reviewed by the run its event starts. The skipped
  # job reports a check named `review-run`, never the required status `review`.
  review-run:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.draft == false &&
      !(github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, format('reviewed-{0}', github.event.pull_request.head.sha))) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    # On the job, not on the workflow: a run whose job is skipped must not cancel a running review.
    concurrency:
      group: review-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Note the start time
        run: echo "REVIEW_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r tools/review/requirements.txt
      # Only the download is tried again: a CLI that does not start is a defect, not the network.
      - name: Install the Claude CLI, proven by running it
        run: |
          for attempt in 1 2 3; do
            if npm install --global --silent @anthropic-ai/claude-code@2.1.283; then break; fi
            if [ "$attempt" = 3 ]; then echo "the Claude CLI did not install"; exit 1; fi
            sleep 10
          done
          claude --version
      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          REVIEW_TIMEOUT_MIN: 90
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: '"$RUNNER_TEMP/venv/bin/python" tools/review/review.py'
